name: Loadstone
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.brudvik
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  Loadstone:
    type: application
    platform: macOS
    sources:
      - path: Loadstone
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brudvik.loadstone
        PRODUCT_NAME: Loadstone
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: Loadstone/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Loadstone/App/Loadstone.entitlements
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        DEVELOPMENT_TEAM: 3GS65HFAFH
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_APP_SANDBOX: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ENABLE_HARDENED_RUNTIME: true
          CODE_SIGN_IDENTITY: "Developer ID Application: Morten Brudvik (3GS65HFAFH)"
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # The README promises an Apple Silicon-only download; without this a Release build is universal.
          ARCHS: arm64
    dependencies:
      - package: KeyboardShortcuts
      - sdk: ApplicationServices.framework
      - sdk: ServiceManagement.framework

  LoadstoneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LoadstoneTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.brudvik.loadstone.tests
    dependencies:
      - target: Loadstone

# A committed scheme so `xcodebuild -scheme Loadstone test` works in CI without Xcode
# autocreating one first.
schemes:
  Loadstone:
    build:
      targets:
        Loadstone: all
        LoadstoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoadstoneTests
    archive:
      config: Release
