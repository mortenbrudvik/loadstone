<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Loadstone layouts: halves, quarters, and thirds">
  <defs>
    <style>
      .frame { fill: #111827; stroke: #374151; stroke-width: 2; }
      .pane { stroke: #111827; stroke-width: 3; }
      .label { fill: #9ca3af; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; }
      .key { fill: #e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <!-- Halves -->
  <text x="150" y="22" text-anchor="middle" class="label">Halves</text>
  <rect x="24" y="36" width="252" height="168" rx="16" class="frame"/>
  <rect x="32" y="44" width="116" height="152" rx="8" class="pane" fill="#60a5fa"/>
  <rect x="152" y="44" width="116" height="152" rx="8" class="pane" fill="#93c5fd"/>
  <text x="90" y="126" text-anchor="middle" class="key">⌃⌥←</text>
  <text x="210" y="126" text-anchor="middle" class="key">⌃⌥→</text>
  <text x="150" y="228" text-anchor="middle" class="label">Sides of the screen</text>

  <!-- Quarters -->
  <text x="480" y="22" text-anchor="middle" class="label">Corners</text>
  <rect x="354" y="36" width="252" height="168" rx="16" class="frame"/>
  <rect x="362" y="44" width="116" height="72" rx="8" class="pane" fill="#34d399"/>
  <rect x="482" y="44" width="116" height="72" rx="8" class="pane" fill="#6ee7b7"/>
  <rect x="362" y="124" width="116" height="72" rx="8" class="pane" fill="#a7f3d0"/>
  <rect x="482" y="124" width="116" height="72" rx="8" class="pane" fill="#d1fae5"/>
  <text x="420" y="86" text-anchor="middle" class="key">⌃⌥U</text>
  <text x="540" y="86" text-anchor="middle" class="key">⌃⌥I</text>
  <text x="420" y="166" text-anchor="middle" class="key">⌃⌥J</text>
  <text x="540" y="166" text-anchor="middle" class="key">⌃⌥K</text>
  <text x="480" y="228" text-anchor="middle" class="label">Drag to a corner, or U I J K</text>

  <!-- Thirds -->
  <text x="810" y="22" text-anchor="middle" class="label">Thirds</text>
  <rect x="684" y="36" width="252" height="168" rx="16" class="frame"/>
  <rect x="692" y="44" width="76" height="152" rx="8" class="pane" fill="#fbbf24"/>
  <rect x="772" y="44" width="76" height="152" rx="8" class="pane" fill="#fcd34d"/>
  <rect x="852" y="44" width="76" height="152" rx="8" class="pane" fill="#fde68a"/>
  <text x="730" y="126" text-anchor="middle" class="key">⌃⌥D</text>
  <text x="810" y="126" text-anchor="middle" class="key">⌃⌥F</text>
  <text x="890" y="126" text-anchor="middle" class="key">⌃⌥G</text>
  <text x="810" y="228" text-anchor="middle" class="label">Bottom edge, or D F G</text>

  <text x="480" y="262" text-anchor="middle" class="label">Top edge maximizes · Restore with ⌃⌥⌫</text>
</svg>
