<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Loadstone drag zones: corners give quarters, the left and right edges give halves, the top edge maximizes, the bottom edge gives thirds; on a portrait screen the sides give corner, vertical third, corner and the bottom edge gives halves">
  <defs>
    <style>
      .frame { fill: #111827; stroke: #374151; stroke-width: 2; }
      .zone { stroke: #111827; stroke-width: 1; }
      .label { fill: #9ca3af; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; }
      .legend { fill: #9ca3af; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <!-- Landscape screen: 400 x 225 at (110, 40) -->
  <text x="310" y="28" text-anchor="middle" class="label">Landscape screen</text>
  <rect x="110" y="40" width="400" height="225" rx="12" class="frame"/>
  <!-- corners -->
  <rect x="110" y="40" width="56" height="56" rx="6" class="zone" fill="#34d399"/>
  <rect x="454" y="40" width="56" height="56" rx="6" class="zone" fill="#34d399"/>
  <rect x="110" y="209" width="56" height="56" rx="6" class="zone" fill="#34d399"/>
  <rect x="454" y="209" width="56" height="56" rx="6" class="zone" fill="#34d399"/>
  <!-- top edge: maximize -->
  <rect x="166" y="40" width="288" height="16" class="zone" fill="#a78bfa"/>
  <!-- left and right edges: halves -->
  <rect x="110" y="96" width="16" height="113" class="zone" fill="#60a5fa"/>
  <rect x="494" y="96" width="16" height="113" class="zone" fill="#93c5fd"/>
  <!-- bottom edge: thirds by position along the full width -->
  <rect x="166" y="249" width="77" height="16" class="zone" fill="#fbbf24"/>
  <rect x="243" y="249" width="134" height="16" class="zone" fill="#fcd34d"/>
  <rect x="377" y="249" width="77" height="16" class="zone" fill="#fde68a"/>
  <text x="310" y="158" text-anchor="middle" class="label">drag a window to a colored zone</text>

  <!-- Portrait screen: 150 x 240 at (640, 40) -->
  <text x="715" y="28" text-anchor="middle" class="label">Portrait screen</text>
  <rect x="640" y="40" width="150" height="240" rx="12" class="frame"/>
  <!-- corners -->
  <rect x="640" y="40" width="36" height="36" rx="6" class="zone" fill="#34d399"/>
  <rect x="754" y="40" width="36" height="36" rx="6" class="zone" fill="#34d399"/>
  <rect x="640" y="244" width="36" height="36" rx="6" class="zone" fill="#34d399"/>
  <rect x="754" y="244" width="36" height="36" rx="6" class="zone" fill="#34d399"/>
  <!-- top edge: maximize -->
  <rect x="676" y="40" width="78" height="14" class="zone" fill="#a78bfa"/>
  <!-- sides split along the height: corner / vertical third / corner -->
  <rect x="640" y="76" width="14" height="44" class="zone" fill="#34d399"/>
  <rect x="640" y="120" width="14" height="80" class="zone" fill="#fcd34d"/>
  <rect x="640" y="200" width="14" height="44" class="zone" fill="#34d399"/>
  <rect x="776" y="76" width="14" height="44" class="zone" fill="#34d399"/>
  <rect x="776" y="120" width="14" height="80" class="zone" fill="#fcd34d"/>
  <rect x="776" y="200" width="14" height="44" class="zone" fill="#34d399"/>
  <!-- bottom edge: halves -->
  <rect x="676" y="266" width="39" height="14" class="zone" fill="#60a5fa"/>
  <rect x="715" y="266" width="39" height="14" class="zone" fill="#93c5fd"/>

  <!-- Legend -->
  <rect x="110" y="294" width="14" height="14" rx="3" fill="#34d399"/>
  <text x="130" y="306" class="legend">Corner: quarter</text>
  <rect x="250" y="294" width="14" height="14" rx="3" fill="#60a5fa"/>
  <text x="270" y="306" class="legend">Side: half</text>
  <rect x="360" y="294" width="14" height="14" rx="3" fill="#a78bfa"/>
  <text x="380" y="306" class="legend">Top: maximize</text>
  <rect x="500" y="294" width="14" height="14" rx="3" fill="#fcd34d"/>
  <text x="520" y="306" class="legend">Bottom: thirds</text>
  <text x="110" y="330" class="label">Edge zones are 16 pt deep and corners are 140 pt squares; corners win over edges.</text>
</svg>
